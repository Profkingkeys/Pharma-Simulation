<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A browser-based 3D extemporaneous-dispensing training simulation." />
  <title>Pharma Simulation | Extemporaneous Dispensing Lab</title>
  <link rel="stylesheet" href="./src/web/styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="lab" aria-label="Interactive three-dimensional dispensing laboratory"></canvas>
    <section class="hud" aria-live="polite">
      <header>
        <p class="eyebrow">PHARMA SIMULATION • TRAINING BUILD</p>
        <h1>Extemporaneous Dispensing Lab</h1>
        <p id="objective"></p>
      </header>
      <div class="meters">
        <label>Patient outcome <meter id="health" min="0" max="100" value="45"></meter></label>
        <span id="score">Score 0</span>
      </div>
      <div id="status" class="status">Verify the prescription to enter the chamber.</div>
      <div id="actions" class="actions"></div>
      <div class="legend"><span class="safe"></span> required material <span class="hazard"></span> contaminant</div>
      <button id="restart" class="secondary" type="button">Restart mission</button>
    </section>
    <section id="mission-panel" class="mission-panel">
      <h2 id="mission-title">Mission briefing</h2>
      <p id="mission-copy"></p>
      <button id="begin" type="button">Verify prescription and begin</button>
      <small>Educational simulation only. It omits real quantities and is not a compounding formula or clinical instruction.</small>
    </section>
  </main>
  <script type="module" src="./src/web/main.js"></script>
</body>
</html>
